name: generate animation

on:
  schedule:
    - cron: "0 0 */3 * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: recolor snake to Asteriuz palette
        run: |
          cd dist
          for f in github-contribution-grid-snake.svg github-contribution-grid-snake-dark.svg; do
            # células de contribuição → vermelho principal
            sed -i -e 's/#9be9a8/#FF3131/g' -e 's/#40c463/#FF3131/g' "$f"
            sed -i -e 's/#01311f/#FF3131/g' -e 's/#034525/#FF3131/g' "$f"
            sed -i -e 's/#30a14e/#E53E3E/g' -e 's/#216e39/#B22B2B/g' "$f"
            sed -i -e 's/#0f6d31/#E53E3E/g' -e 's/#00c647/#B22B2B/g' "$f"
            # células vazias
            sed -i -e 's/#ebedf0/#2A2A2A/g' -e 's/#161b22/#2A2A2A/g' "$f"
            # corpo e cabeça da cobra → tint rosa (destaque sobre o grid vermelho)
            sed -i 's/purple/#FF8585/g' "$f"
          done

      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
